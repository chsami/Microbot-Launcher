name: PR CI

on:
    pull_request:
        branches:
            - development
            - main

concurrency:
    group: pr-ci-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: read

jobs:
    resolve:
        name: Resolve base
        runs-on: ubuntu-latest
        outputs:
            base: ${{ steps.base.outputs.base }}
        steps:
            - name: Wait for a pull request against main to be moved
              id: base
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.pull_request.number }}
                  BASE: ${{ github.event.pull_request.base.ref }}
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
                  HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
              run: |
                  set -euo pipefail
                  if [ "$BASE" != "main" ] || { [ "$HEAD_REF" = "development" ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; }; then
                      echo "base=" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  echo "This pull request targets main and will be moved to development; testing it against the new base."
                  for attempt in $(seq 1 12); do
                      sleep 10
                      NEW_BASE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .base.ref)
                      if [ "$NEW_BASE" != "main" ]; then
                          echo "Testing against $NEW_BASE"
                          echo "base=$NEW_BASE" >> "$GITHUB_OUTPUT"
                          exit 0
                      fi
                  done
                  echo "::error::This pull request still targets main. Change its base branch to development."
                  exit 1

    test:
        name: Test (${{ matrix.os }})
        needs: resolve
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.resolve.outputs.base || github.sha }}
                  fetch-depth: ${{ needs.resolve.outputs.base && '0' || '1' }}

            - name: Merge the pull request into its new base
              if: needs.resolve.outputs.base != ''
              shell: bash
              env:
                  PR: ${{ github.event.pull_request.number }}
                  NEW_BASE: ${{ needs.resolve.outputs.base }}
              run: |
                  git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head"
                  if ! git -c user.name=ci -c user.email=ci@localhost merge --no-edit pr/head; then
                      echo "::error::This pull request conflicts with $NEW_BASE. Rebase it onto $NEW_BASE and push again."
                      exit 1
                  fi
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci
            - run: npm test

    package:
        name: Package (linux)
        needs: resolve
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.resolve.outputs.base || github.sha }}
                  fetch-depth: ${{ needs.resolve.outputs.base && '0' || '1' }}

            - name: Merge the pull request into its new base
              if: needs.resolve.outputs.base != ''
              shell: bash
              env:
                  PR: ${{ github.event.pull_request.number }}
                  NEW_BASE: ${{ needs.resolve.outputs.base }}
              run: |
                  git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head"
                  if ! git -c user.name=ci -c user.email=ci@localhost merge --no-edit pr/head; then
                      echo "::error::This pull request conflicts with $NEW_BASE. Rebase it onto $NEW_BASE and push again."
                      exit 1
                  fi
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci

            - name: Package without publishing
              run: npx electron-builder --linux dir --publish never
