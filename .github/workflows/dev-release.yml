name: Dev release

on:
    push:
        branches:
            - development
    workflow_dispatch:

concurrency:
    group: dev-release
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    build_windows:
        uses: ./.github/workflows/build-windows.yml
        with:
            channel: dev

    build_linux:
        uses: ./.github/workflows/build-linux.yml
        with:
            channel: dev

    build_mac:
        uses: ./.github/workflows/build-mac.yml
        with:
            channel: dev

    release:
        needs: [build_windows, build_linux, build_mac]
        uses: ./.github/workflows/create-release.yml
        with:
            channel: dev
        secrets: inherit

    upload:
        needs: release
        uses: ./.github/workflows/upload-hetzner.yml
        with:
            channel: dev
        secrets: inherit
